name: Release

# Push a tag like `v0.1.0` to build the installers and publish a GitHub release.
# Windows only for now — macOS and Linux are coming soon (uncomment their matrix entries when ready).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          # - os: macos-latest
          #   script: dist:mac
          # - os: ubuntu-latest
          #   script: dist:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          # Builds are unsigned for now.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Run the packaged app on this clean machine; if it cannot install its engine, analyze, download or detect
      # videos, nothing gets published.
      - name: Smoke test the packaged app
        if: runner.os == 'Windows'
        run: ./scripts/smoke.ps1 -Exe release\win-unpacked\StreamPull.exe
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  # The Android app (mobile/). Signed with the maintainer key from repository secrets; without them the APKs are
  # skipped (a debug-signed APK could never be updated in place), and the desktop release still goes out.
  android-build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Check for the signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.SP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/streampull.jks"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SP_KEYSTORE_BASE64 is not set - the Android APKs are not built for this release."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build one APK per CPU type
        if: steps.key.outputs.ok == 'true'
        working-directory: mobile
        env:
          SP_KEYSTORE: ${{ runner.temp }}/streampull.jks
          SP_KEYSTORE_PASSWORD: ${{ secrets.SP_KEYSTORE_PASSWORD }}
          SP_KEY_ALIAS: ${{ secrets.SP_KEY_ALIAS }}
          SP_KEY_PASSWORD: ${{ secrets.SP_KEY_PASSWORD }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${ver%%-*}"
          code=$(( major * 10000 + minor * 100 + patch ))
          flutter pub get
          flutter build apk --release --split-per-abi --build-name "$ver" --build-number "$code"
          mkdir -p "$GITHUB_WORKSPACE/android-release"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "$GITHUB_WORKSPACE/android-release/StreamPull-$ver-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          name: installers-android
          if-no-files-found: error
          path: android-release/*.apk

  # Same emulator test as CI: the engine starts and a download works. Nothing is published if it fails.
  android-smoke:
    name: Android smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Install ffmpeg (to generate the test clip)
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: mobile
          disable-animations: true
          script: bash tool/ci_smoke.sh

  publish:
    name: Publish release
    needs: [build, android-build, android-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          generate_release_notes: true
