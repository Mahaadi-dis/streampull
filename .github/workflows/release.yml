name: Release

# Push a tag like `v0.1.0` to build the installers and publish a GitHub release.
# Windows only for now — macOS and Linux are coming soon (uncomment their matrix entries when ready).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          # - os: macos-latest
          #   script: dist:mac
          # - os: ubuntu-latest
          #   script: dist:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          # Builds are unsigned for now.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Run the packaged app on this clean machine; if it cannot install its engine, analyze, download or detect
      # videos, nothing gets published.
      - name: Smoke test the packaged app
        if: runner.os == 'Windows'
        run: ./scripts/smoke.ps1 -Exe release\win-unpacked\StreamPull.exe
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          generate_release_notes: true
