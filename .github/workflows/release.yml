name: Release

# Push a tag like `v0.1.0` to build the installers and publish a GitHub release.
# Windows only for now — macOS and Linux are coming soon (uncomment their matrix entries when ready).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          # - os: macos-latest
          #   script: dist:mac
          # - os: ubuntu-latest
          #   script: dist:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Windows code signing, when the repository has the secrets for it (see docs/windows-code-signing.md):
      #   - Azure Artifact Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_SIGN_ENDPOINT,
      #     AZURE_SIGN_ACCOUNT, AZURE_SIGN_PROFILE (and optionally AZURE_SIGN_PUBLISHER)
      #   - or a certificate file: WIN_CERT_BASE64 (the .pfx, base64) and WIN_CERT_PASSWORD
      # Without them the build is simply unsigned, as before.
      - name: Build
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets.WIN_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
        run: |
          args=()
          if [ -n "$AZURE_SIGN_ACCOUNT" ]; then
            args+=("-c.win.azureSignOptions.endpoint=$AZURE_SIGN_ENDPOINT" "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGN_ACCOUNT" "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGN_PROFILE")
            [ -n "$AZURE_SIGN_PUBLISHER" ] && args+=("-c.win.azureSignOptions.publisherName=$AZURE_SIGN_PUBLISHER")
            unset CSC_LINK CSC_KEY_PASSWORD
            echo "Signing with Azure Artifact Signing"
          elif [ -n "$CSC_LINK" ]; then
            echo "Signing with the certificate file"
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            echo "::warning::No Windows signing secrets are set - this build is not code-signed (SmartScreen may warn users)."
          fi
          npm run ${{ matrix.script }} -- "${args[@]}"
      - name: Check the Windows signature
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECT_SIGNED: ${{ (secrets.WIN_CERT_BASE64 != '' || secrets.AZURE_SIGN_ACCOUNT != '') && 'true' || 'false' }}
        run: |
          $files = Get-ChildItem release/*.exe
          $bad = @()
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host ("{0}: {1} {2}" -f $f.Name, $sig.Status, $sig.SignerCertificate.Subject)
            if ($sig.Status -ne 'Valid') { $bad += $f.Name }
          }
          if ($env:EXPECT_SIGNED -eq 'true' -and $bad.Count -gt 0) {
            Write-Host "::error::These files are not validly signed: $($bad -join ', ')"
            exit 1
          }
      # Run the packaged app on this clean machine; if it cannot install its engine, analyze, download or detect
      # videos, nothing gets published.
      - name: Smoke test the packaged app
        if: runner.os == 'Windows'
        run: ./scripts/smoke.ps1 -Exe release\win-unpacked\StreamPull.exe
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  # The Android app (mobile/). Signed with the maintainer key from repository secrets; without them the APKs are
  # skipped (a debug-signed APK could never be updated in place), and the desktop release still goes out.
  android-build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Check for the signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.SP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/streampull.jks"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SP_KEYSTORE_BASE64 is not set - the Android APKs are not built for this release."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build one APK per CPU type
        if: steps.key.outputs.ok == 'true'
        working-directory: mobile
        env:
          SP_KEYSTORE: ${{ runner.temp }}/streampull.jks
          SP_KEYSTORE_PASSWORD: ${{ secrets.SP_KEYSTORE_PASSWORD }}
          SP_KEY_ALIAS: ${{ secrets.SP_KEY_ALIAS }}
          SP_KEY_PASSWORD: ${{ secrets.SP_KEY_PASSWORD }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${ver%%-*}"
          code=$(( major * 10000 + minor * 100 + patch ))
          flutter pub get
          flutter build apk --release --split-per-abi --build-name "$ver" --build-number "$code"
          mkdir -p "$GITHUB_WORKSPACE/android-release"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "$GITHUB_WORKSPACE/android-release/StreamPull-$ver-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          name: installers-android
          if-no-files-found: error
          path: android-release/*.apk

  # Same emulator test as CI: the engine starts and a download works. Nothing is published if it fails.
  android-smoke:
    name: Android smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Install ffmpeg (to generate the test clip)
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: mobile
          disable-animations: true
          script: bash tool/ci_smoke.sh

  publish:
    name: Publish release
    needs: [build, android-build, android-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          generate_release_notes: true
