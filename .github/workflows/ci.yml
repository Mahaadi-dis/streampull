name: CI

on:
  push:
    branches: [main, android-flutter]
  pull_request:

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # A clean Windows machine (like a first install, with Arabic-named folders): the download engine must install,
  # a link must analyze and download, and the built-in browser must detect a video.
  smoke:
    name: Smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows Server 2022 (Windows 10 era), Windows Server 2025, and Windows 11 on ARM, where the x64 build
        # runs under emulation like on Surface / Snapdragon laptops.
        os: [windows-2022, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Build the real package and test that: it is what users run.
      - run: npm run dist:win -- --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: ./scripts/smoke.ps1 -Exe release/win-unpacked/StreamPull.exe

  # The Android app (mobile/, Flutter): static analysis + unit tests, then the real app on an emulator — the bundled
  # engine must start, a link must analyze and download, and the file must land in Downloads/StreamPull.
  android:
    name: Android (analyze, test, emulator smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Install ffmpeg (to generate the test clip)
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: mobile
          disable-animations: true
          script: bash tool/ci_smoke.sh
