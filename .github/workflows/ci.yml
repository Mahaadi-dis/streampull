name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # A clean Windows machine (like a first install, with Arabic-named folders): the download engine must install,
  # a link must analyze and download, and the built-in browser must detect a video.
  smoke:
    name: Smoke test (clean Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: ./scripts/smoke.ps1 -Exe node_modules\electron\dist\electron.exe -AppArgs @('.')
